
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIT Assignment Reminder</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <h1>My Assignment Reminder</h1>
    <p class="tagline">Never miss an assignment deadline!</p>

    <button type="button" onclick="window.location.href='assignments.html'">
        View All Assignments
    </button>

    <div class="resource-buttons">
        <button type="button" onclick="window.open('./tt.png.jpg', '_blank')">
            📅 Timetable
        </button>

        <button type="button" onclick="window.open('https://drive.google.com/drive/folders/1PIX3sTrXXQq_VYHGAOUxUa72laPbBHL8', '_blank')">
            📚 Model Papers
        </button>

        <button type="button" onclick="window.open('./portions.pdf.pdf', '_blank')">
            📘 Academic Syllabus
        </button>
    </div>

    <h2>Add a New Assignment</h2>

    <div id="assignmentList"></div>

    <form id="assignmentForm">
        <label for="subject">Choose Subject:</label>

        <select id="subject" name="subject">
            <option>Mathematics</option>
            <option>Physics</option>
            <option>Mechanics</option>
            <option>Makerspace</option>
            <option>ED</option>
            <option>Tamil</option>
            <option>English</option>
        </select>

        <br><br>

        <label for="assignment">Assignment Name:</label>

        <input
            type="text"
            id="assignment"
            name="assignment"
            placeholder="Enter assignment name"
            required
        >

        <br><br>

        <label for="deadline">Submission Date:</label>

        <input
            type="date"
            id="deadline"
            name="deadline"
            required
        >

        <br><br>

        <button type="submit">Add Assignment</button>
    </form>

    <p id="successMessage" style="color: green; text-align: center; font-weight: bold;"></p>

    <button type="button" id="enableNotifications">
        Enable Notifications 🔔
    </button>

    <script>
        // Supabase initialization (no login form)
        const SUPABASE_URL = "https://rgmwjfjgdgrgselqmwko.supabase.co";

        // Replace the placeholder with your existing Supabase
        // publishable key from your previous code.
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_qYqQljM4abnJ_KNWO9ltoA_-1Rkowxl";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        console.log("Supabase client initialized!");

        // Register the service worker
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker
                    .register("./service-worker.js")
                    .then(function () {
                        console.log("Service worker registered!");
                    })
                    .catch(function (error) {
                        console.error(
                            "Service worker registration failed:",
                            error
                        );
                    });
            });
        }

        // Load existing assignments from localStorage
        const form = document.getElementById("assignmentForm");
        const assignmentList = document.getElementById("assignmentList");
        const successMessage = document.getElementById("successMessage");

        let assignments = JSON.parse(
            localStorage.getItem("assignments")
        ) || [];

        function saveAssignments() {
            localStorage.setItem(
                "assignments",
                JSON.stringify(assignments)
            );
        }

        function displayAssignments() {
            assignmentList.innerHTML = "";

            assignments.forEach(function (assignment, index) {
                const card = document.createElement("div");
                card.className = "assignment-card";

                const heading = document.createElement("h3");
                const details = document.createElement("p");
                const status = document.createElement("p");

                heading.textContent = assignment.name +
                    (assignment.completed ? " (Completed)" : "");

                details.textContent =
                    "Subject: " + assignment.subject +
                    " | Due: " + assignment.date;

                status.textContent = assignment.completed
                    ? "Status: Completed ✓"
                    : "Status: Pending";

                status.className = assignment.completed
                    ? "status-completed"
                    : "status-pending";

                card.appendChild(heading);
                card.appendChild(details);
                card.appendChild(status);

                if (!assignment.completed) {
                    const completeButton = document.createElement("button");
                    completeButton.textContent = "✓ Mark Completed";
                    completeButton.type = "button";

                    completeButton.addEventListener("click", function () {
                        assignments[index].completed = true;
                        saveAssignments();
                        displayAssignments();
                    });

                    card.appendChild(completeButton);
                }

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "🗑️ Delete";
                deleteButton.type = "button";

                deleteButton.addEventListener("click", function () {
                    if (confirm("Are you sure you want to delete this assignment?")) {
                        assignments.splice(index, 1);
                        saveAssignments();
                        displayAssignments();
                    }
                });

                card.appendChild(deleteButton);
                assignmentList.appendChild(card);
            });
        }

        // Add an assignment
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const subject = document.getElementById("subject").value;
            const name = document.getElementById("assignment").value.trim();
            const date = document.getElementById("deadline").value;

            if (!name || !date) {
                alert("Enter the assignment name and date.");
                return;
            }

            assignments.push({
                subject: subject,
                name: name,
                date: date,
                completed: false
            });

            saveAssignments();
            displayAssignments();
            form.reset();

            successMessage.textContent =
                "✅ Assignment added successfully!";

            setTimeout(function () {
                successMessage.textContent = "";
            }, 3000);
        });

        
        // Register this device for real push notifications
        function urlBase64ToUint8Array(base64String) {
            const padding = "=".repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding)
                .replace(/-/g, "+")
                .replace(/_/g, "/");

            const raw = atob(base64);
            return Uint8Array.from(raw, char => char.charCodeAt(0));
        }

        document.getElementById("enableNotifications")
            .addEventListener("click", async function () {
                try {
                    if (!("serviceWorker" in navigator) ||
                        !("PushManager" in window) ||
                        !("Notification" in window)) {
                        alert("Push notifications are not supported here.");
                        return;
                    }

                    const permission = await Notification.requestPermission();

                    if (permission !== "granted") {
                        alert("Please allow notifications in browser settings.");
                        return;
                    }

                    const registration = await navigator.serviceWorker.ready;

                    // Paste your PUBLIC VAPID key from Supabase Secrets here.
                    const vapidPublicKey = "5afb167b83920365a69a6c1a75bc2b4ff7a7d17fd14217b87468ec3a";

                    if (vapidPublicKey.includes("PASTE_")) {
                        alert("Add your public VAPID key in the code first.");
                        return;
                    }

                    const subscription = await registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(vapidPublicKey)
                    });

                    // Enter the setup token when prompted; never hardcode it.
                    const deviceToken = prompt(
                        "Enter your private device setup token:"
                    );

                    if (!deviceToken) {
                        alert("Registration cancelled.");
                        return;
                    }

                    const response = await fetch(
                        "https://rgmwjfjgdgrgselqmwko.supabase.co/functions/v1/send-assignment-reminders",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "x-device-token": deviceToken
                            },
                            body: JSON.stringify({
                                subscription: subscription.toJSON()
                            })
                        }
                    );

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.error || "Registration failed.");
                    }

                    alert("Push subscription registered successfully! 💜");
                } catch (error) {
                    console.error("Push registration failed:", error);
                    alert("Registration failed: " + error.message);
                }
            });


        displayAssignments();
    </script>
</body>
</html>
