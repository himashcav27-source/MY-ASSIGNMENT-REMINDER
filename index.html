    <h2>Add a New Assignment</h2>

    <form>
        <label for="subject">Choose Subject:</label>

        <select id="subject" name="subject">
            <option>Mathematics</option>
            <option>Physics</option>
            <option>Mechanics</option>
            <option>Makerspace</option>
            <option>ED</option>
            <option>Tamil</option>
            <option>English</option>
        </select>

        <br><br>

        <label for="assignment">Assignment Name:</label>

        <input
            type="text"
            id="assignment"
            name="assignment"
            placeholder="Enter assignment name"
            required
        >

        <br><br>

        <label for="deadline">Submission Date:</label>

        <input
            type="date"
            id="deadline"
            name="deadline"
            required
        >

        <br><br>

        <button type="submit">Add Assignment</button>
    </form>
    <p id="successMessage" style="color: green; text-align: center; font-weight: bold;"></p>
    

<script>
    

const form = document.querySelector("form");
const assignmentList = document.createElement("div");
assignmentList.id = "assignmentList";
form.insertAdjacentElement("beforebegin", assignmentList);

let assignments = JSON.parse(localStorage.getItem("assignments")) || [];

function saveAssignments() {
    localStorage.setItem("assignments", JSON.stringify(assignments));
}

function displayAssignments() {
    assignmentList.innerHTML = "";

    assignments.forEach(function(assignment, index) {
        const card = document.createElement("div");
        const heading = document.createElement("h3");
        const details = document.createElement("p");
        const completeButton = document.createElement("button");

        heading.textContent = assignment.name +
            (assignment.completed ? " (Completed)" : "");

        details.textContent =
            "Subject: " + assignment.subject +
            " | Due: " + assignment.date;

        card.appendChild(heading);
        card.appendChild(details);

        if (!assignment.completed) {
            completeButton.textContent = "Mark Completed";

            completeButton.addEventListener("click", function() {
                assignments[index].completed = true;
                saveAssignments();
                displayAssignments();
            });

            card.appendChild(completeButton);
        }

        assignmentList.appendChild(card);
    });
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const subject = document.getElementById("subject").value;
    const name = document.getElementById("assignment").value.trim();
    const date = document.getElementById("deadline").value;

    if (name === "" || date === "") {
        alert("Enter the assignment name and date.");
        return;
    }

    assignments.push({
        subject: subject,
        name: name,
        date: date,
        completed: false
    });

    

saveAssignments();
form.reset();


const successMessage = document.getElementById("successMessage");
successMessage.style.color = "white";
successMessage.textContent = "✅ Assignment added successfully!";

setTimeout(function () {
    successMessage.textContent = "";
}, 3000);


});

displayAssignments();

           



</script>

<div id="supabaseLoginBox">
    <h2>Sign in to save your assignments</h2>

    <form id="supabaseLoginForm">
        <label for="loginEmail">Email:</label>
        <input
            type="email"
            id="loginEmail"
            required
            placeholder="Enter your Supabase email"
        >

        <br><br>

        <label for="loginPassword">Password:</label>
        <input
            type="password"
            id="loginPassword"
            required
            placeholder="Enter your password"
        >

        <br><br>

        <button type="submit">Sign In</button>
    </form>

    <p id="loginMessage"></p>
</div>

<script>
document.getElementById("supabaseLoginForm")
    .addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;
        const message = document.getElementById("loginMessage");

        message.textContent = "Signing in...";

        const { data, error } = await supabaseClient.auth
            .signInWithPassword({ email, password });

        if (error) {
            message.textContent = "Sign-in failed. Check your email and password.";
            console.error("Supabase sign-in error:", error.message);
            return;
        }

        message.textContent = "Signed in successfully! 💜";
        document.getElementById("supabaseLoginForm").reset();

        console.log("Supabase session established.");
    });
</script>

<button id="enableNotifications">Enable Notifications 🔔</button>


<script>
    document.getElementById("enableNotifications").addEventListener("click", async function () {
    if (!("Notification" in window)) {
        alert("Notifications are not supported by this browser.");
        return;
    }

    const permission = await Notification.requestPermission();

    if (permission === "granted") {
        alert("Notifications enabled successfully! 💜");

    }
